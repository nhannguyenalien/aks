apiVersion: v1
kind: Namespace
metadata:
  name: schoolsai-anythingllm
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: anythingllm-storage
  namespace: schoolsai-anythingllm
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anythingllm
  namespace: schoolsai-anythingllm
  labels:
    app.kubernetes.io/name: anythingllm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: anythingllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anythingllm
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-pve
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: anythingllm
          image: mintplexlabs/anythingllm:1.16.0
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add:
                - SYS_ADMIN
          env:
            - name: SERVER_PORT
              value: "3001"
            - name: STORAGE_DIR
              value: /app/server/storage
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/ping
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/ping
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: storage
              mountPath: /app/server/storage
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: anythingllm-storage
---
apiVersion: v1
kind: Service
metadata:
  name: anythingllm
  namespace: schoolsai-anythingllm
spec:
  selector:
    app.kubernetes.io/name: anythingllm
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: anythingllm
  namespace: schoolsai-anythingllm
spec:
  ingressClassName: traefik
  rules:
    - host: anythingllm-vps.schoolsai.work
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: anythingllm
                port:
                  name: http

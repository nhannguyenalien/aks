apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: schoolsai
  namespace: argocd
spec:
  description: SchoolsAI applications managed through reviewed Git commits
  sourceRepos:
    - git@github.com:nhannguyenalien/aks.git
  destinations:
    - namespace: demo-api
      server: https://kubernetes.default.svc
    - namespace: schoolsai-*
      server: https://kubernetes.default.svc
    - namespace: external-dns
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true

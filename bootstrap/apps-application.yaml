apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: schoolsai-apps
  namespace: argocd
spec:
  project: schoolsai
  source:
    repoURL: git@github.com:nhannguyenalien/aks.git
    targetRevision: main
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ServerSideApply=true

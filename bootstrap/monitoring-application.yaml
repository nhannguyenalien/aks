apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: schoolsai-monitoring
  namespace: argocd
spec:
  project: schoolsai
  source:
    repoURL: git@github.com:nhannguyenalien/aks.git
    targetRevision: main
    path: platform/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
